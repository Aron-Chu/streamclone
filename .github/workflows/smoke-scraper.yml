name: Smoke Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  smoke-scraper:
    name: Scraper profile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout scraper sibling
        env:
          SCRAPER_REPO: ${{ github.repository_owner }}/streamclone-scraper
        run: |
          set -euo pipefail
          dest="$(dirname "$GITHUB_WORKSPACE")/streamclone-scraper"
          if [ ! -d "$dest/.git" ]; then
            git clone --depth 1 "https://github.com/${SCRAPER_REPO}.git" "$dest"
          fi
      - run: cp .env.dev .env
      - name: Start stack with scraper profile
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            --profile scraper \
            up -d --build
      - name: Wait for health endpoints
        run: |
          set -euo pipefail
          bash scripts/smoke-core.sh
          echo "waiting for scraper"
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              curl -v http://localhost:8000/health || true
              exit 1
            fi
            sleep 2
          done
      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            --profile scraper ps
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            --profile scraper logs
      - name: Stop stack
        if: always()
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            --profile scraper down -v
