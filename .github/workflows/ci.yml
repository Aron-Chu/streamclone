name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  COMPOSE_CI: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.local-tunnel.yml

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-quick:
    name: Quick PR gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/ci-bootstrap-env.sh
      - run: cd frontend && npm ci
      - run: make check-quick

  check-full:
    name: Full gate (make check)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - name: Install security-scan deps
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/ci-bootstrap-env.sh
      - run: cd frontend && npm ci
      - run: make check
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  codegraph:
    name: Code graph rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'internal/**'
              - 'frontend/src/**'
              - 'cmd/**'
              - 'tools/codegraph/**'
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache codegraph venv
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .codegraph/.venv
          key: codegraph-venv-${{ runner.os }}-py3.12-${{ hashFiles('tools/codegraph/requirements.txt') }}
      - name: Cache codegraph database
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .codegraph/streamclone.kuzu
            .codegraph/index.sqlite
            .codegraph/tree-sitter-cache
          key: codegraph-db-${{ runner.os }}-${{ hashFiles('internal/**', 'cmd/**', 'frontend/src/**', 'tools/codegraph/**') }}
          restore-keys: |
            codegraph-db-${{ runner.os }}-
      - if: steps.changes.outputs.code == 'true'
        # Incremental is content-hash based: exact cache hit → noop, stale
        # restore-key → full rebuild. Smoke validates the DB either way.
        run: |
          make codegraph-incremental
          make codegraph-smoke
      - if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-kuzu
          path: .codegraph/streamclone.kuzu
          retention-days: 7
          if-no-files-found: error

  smoke-core:
    name: Core compose smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs:
      - check-full
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/ci-bootstrap-env.sh
      - name: Build core service images
        run: |
          ${{ env.COMPOSE_CI }} build metadata video chat emote frontend
      - name: Start core stack
        run: ${{ env.COMPOSE_CI }} up -d --no-build
      - name: Install frontend deps and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for health endpoints
        run: bash scripts/smoke-core.sh
      - name: Playwright UI smoke
        working-directory: frontend
        run: npm run test:smoke
      - name: Check metrics endpoints
        run: |
          set -euo pipefail
          for url in \
            http://localhost:8081/metrics \
            http://localhost:8082/metrics \
            http://localhost:8083/metrics \
            http://localhost:8084/metrics; do
            curl -fsS "$url" | grep -E "http_requests_total|go_info|process_cpu_seconds_total" >/dev/null
          done
      - name: Dump compose state on failure
        if: failure()
        run: |
          ${{ env.COMPOSE_CI }} ps
          ${{ env.COMPOSE_CI }} logs
      - name: Stop stack
        if: always()
        run: ${{ env.COMPOSE_CI }} down -v
