name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_CI: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.local-tunnel.yml

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans SHA^..SHA on PRs; shallow checkout breaks parent resolution.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Go test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: govulncheck
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: npm audit --audit-level=high

  compose-config:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.dev .env
      - name: Read VERSION
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate core compose
        run: ${{ env.COMPOSE_CI }} config
      - name: Validate release compose overlay
        env:
          IMAGE_TAG: ${{ steps.version.outputs.value }}
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml config
      - name: Validate observability compose
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.observability.yml config

  smoke-core:
    name: Core compose smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - compose-config
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.dev .env
      - name: Build core service images
        run: |
          ${{ env.COMPOSE_CI }} build metadata video chat emote analytics frontend
      - name: Start core stack
        run: ${{ env.COMPOSE_CI }} up -d --no-build
      - name: Install frontend deps and Playwright browsers
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for health endpoints
        run: bash scripts/smoke-core.sh
      - name: Playwright UI smoke
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        working-directory: frontend
        run: npm run test:smoke
      - name: Check metrics endpoints
        run: |
          set -euo pipefail
          for url in \
            http://localhost:8081/metrics \
            http://localhost:8082/metrics \
            http://localhost:8083/metrics \
            http://localhost:8084/metrics; do
            curl -fsS "$url" | grep -E "http_requests_total|go_info|process_cpu_seconds_total" >/dev/null
          done
      - name: Dump compose state on failure
        if: failure()
        run: |
          ${{ env.COMPOSE_CI }} ps
          ${{ env.COMPOSE_CI }} logs
      - name: Stop stack
        if: always()
        run: ${{ env.COMPOSE_CI }} down -v
