name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Go test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Compose and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout scraper sibling
        env:
          # Replace org/user if the scraper repo lives under a different GitHub account.
          SCRAPER_REPO: ${{ github.repository_owner }}/streamclone-scraper
        run: |
          set -euo pipefail
          dest="$(dirname "$GITHUB_WORKSPACE")/streamclone-scraper"
          if [ ! -d "$dest/.git" ]; then
            git clone --depth 1 "https://github.com/${SCRAPER_REPO}.git" "$dest"
          fi
      - run: cp .env.example .env
      - name: Validate app compose
        run: docker compose -f deploy/docker-compose.yml config
      - name: Validate observability compose
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.observability.yml config
      - name: Build metadata image
        run: docker build -f deploy/Dockerfile --build-arg SERVICE=metadata -t streamclone/metadata:ci .
      - name: Build chat image
        run: docker build -f deploy/Dockerfile --build-arg SERVICE=chat -t streamclone/chat:ci .
      - name: Build video image
        run: docker build -f deploy/Dockerfile.video -t streamclone/video:ci .
      - name: Build emote image
        run: docker build -f deploy/Dockerfile.emote -t streamclone/emote:ci .
      - name: Build analytics image
        run: docker build -f deploy/Dockerfile --build-arg SERVICE=analytics -t streamclone/analytics:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t streamclone/frontend:ci frontend

  smoke:
    name: Local compose smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout scraper sibling
        env:
          SCRAPER_REPO: ${{ github.repository_owner }}/streamclone-scraper
        run: |
          set -euo pipefail
          dest="$(dirname "$GITHUB_WORKSPACE")/streamclone-scraper"
          if [ ! -d "$dest/.git" ]; then
            git clone --depth 1 "https://github.com/${SCRAPER_REPO}.git" "$dest"
          fi
      - run: cp .env.example .env
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for health endpoints
        run: |
          set -euo pipefail
          for url in \
            http://localhost:8081/healthz \
            http://localhost:8082/healthz \
            http://localhost:8083/healthz \
            http://localhost:8084/healthz \
            http://localhost:5174/; do
            echo "waiting for $url"
            for i in $(seq 1 90); do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if [ "$i" -eq 90 ]; then
                curl -v "$url" || true
                exit 1
              fi
              sleep 2
            done
          done
      - name: Check metrics endpoints
        run: |
          set -euo pipefail
          for url in \
            http://localhost:8081/metrics \
            http://localhost:8082/metrics \
            http://localhost:8083/metrics \
            http://localhost:8084/metrics; do
            curl -fsS "$url" | grep -E "http_requests_total|go_info|process_cpu_seconds_total" >/dev/null
          done
      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
