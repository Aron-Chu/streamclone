name: Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (default: git ref or latest for manual runs)'
        required: false
        default: ''
      publish_sha:
        description: 'Also tag images with git SHA (manual dispatch only)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: metadata
            dockerfile: deploy/Dockerfile
            context: .
            build_args: SERVICE=metadata
          - image: chat
            dockerfile: deploy/Dockerfile
            context: .
            build_args: SERVICE=chat
          - image: video
            dockerfile: deploy/Dockerfile.video
            context: .
            build_args: ""
          - image: emote
            dockerfile: deploy/Dockerfile.emote
            context: .
            build_args: ""
          - image: analytics
            dockerfile: deploy/Dockerfile
            context: .
            build_args: SERVICE=analytics
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: ""
          - image: clipper
            dockerfile: deploy/Dockerfile.clipper
            context: .
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=sha,prefix=,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_sha == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.value == 'latest' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  package:
    name: Package release bundle
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve bundle version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: bash scripts/package-release.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          files: |
            dist/streamclone-${{ steps.ver.outputs.value }}-windows.zip
            dist/streamclone-${{ steps.ver.outputs.value }}.tar.gz
            launchers/Install Streamclone.cmd
          fail_on_unmatched_files: true
