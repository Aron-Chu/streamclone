name: Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (default: git ref or latest for manual runs)'
        required: false
        default: ''
      publish_sha:
        description: 'Also tag images with git SHA (manual dispatch only)'
        type: boolean
        default: false
      publish_scraper:
        description: 'Also build the optional scraper image from a readable scraper repository'
        type: boolean
        default: false
      scraper_repository:
        description: 'Scraper repository to checkout when publish_scraper is true'
        required: false
        default: 'Aron-Chu/streamclone-scraper'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release-gate:
    name: Release gate (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security-scan deps
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/ci-bootstrap-env.sh
      - run: cd frontend && npm ci
      - run: make check

  publish:
    name: Build and push ${{ matrix.image }}
    needs: release-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: metadata
            dockerfile: deploy/Dockerfile
            context: .
            build_args: SERVICE=metadata
          - image: chat
            dockerfile: deploy/Dockerfile
            context: .
            build_args: SERVICE=chat
          - image: video
            dockerfile: deploy/Dockerfile.video
            context: .
            build_args: ""
          - image: emote
            dockerfile: deploy/Dockerfile.emote
            context: .
            build_args: ""
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: .
            build_args: ""
          - image: migrate
            dockerfile: deploy/Dockerfile.migrate
            context: .
            build_args: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=sha,prefix=,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_sha == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.value == 'latest' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-scraper:
    name: Build and push scraper
    needs: release-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_scraper == 'true'
    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.scraper_repository || 'Aron-Chu/streamclone-scraper' }}
          path: scraper

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/scraper
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=sha,prefix=,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_sha == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.value == 'latest' }}

      - uses: docker/build-push-action@v7
        with:
          context: scraper
          file: scraper/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-smoke:
    name: Release image smoke
    needs: [publish, publish-scraper]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (needs.publish-scraper.result == 'success' || needs.publish-scraper.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            # RC/dispatch tags (e.g. v0.1.4-rc1) are GHCR-only — checkout the commit that triggered the run.
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref || github.sha }}

      - name: Assert IMAGE_TAG matches git tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            GIT_TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "$GIT_TAG" ]; then
              echo "Resolved IMAGE_TAG ($TAG) != git tag ($GIT_TAG)" >&2
              exit 1
            fi
          fi
          # package-release.sh pins IMAGE_TAG to VERSION — same convention here
          VERSION="$TAG"
          test "IMAGE_TAG=$VERSION" = "IMAGE_TAG=$TAG"
          echo "IMAGE_TAG=$TAG matches release bundle convention"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: bash scripts/ci-bootstrap-env.sh

      - name: Validate release compose
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml config

      - name: Pull core GHCR images
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          SCRAPER_PUBLISHED: ${{ needs.publish-scraper.result }}
        run: |
          set -euo pipefail
          echo "GHCR pull sanity: pulling tagged release images before stack start"
          services=(metadata video chat emote frontend migrate)
          if [ "$SCRAPER_PUBLISHED" = "success" ]; then
            services+=(scraper)
          else
            echo "Skipping scraper pull (publish-scraper was not successful)"
          fi
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml \
            pull "${services[@]}"

      - name: Migrate test database (pinned migrate image)
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml \
            up -d postgres
          for i in $(seq 1 30); do
            if docker compose --env-file .env \
              -f deploy/docker-compose.yml \
              -f deploy/docker-compose.local-tunnel.yml \
              -f deploy/docker-compose.release.yml \
              exec -T postgres pg_isready -U app -d streamclone >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml \
            run --rm migrate
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml \
            exec -T postgres psql -U app -d streamclone -c 'SELECT version, dirty FROM schema_migrations;'

      - name: Start core stack from release images
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml \
            up -d --pull always

      - name: Wait for health endpoints
        run: bash scripts/smoke-core.sh

      - name: HLS manifest probe
        continue-on-error: true
        env:
          SMOKE_CHANNEL: ${{ vars.SMOKE_CHANNEL || 'xqc' }}
        run: |
          set -euo pipefail
          CHANNEL="${SMOKE_CHANNEL:-xqc}"
          echo "HLS probe: channel=$CHANNEL (continue-on-error if offline)"
          stop_body=$(printf '{"channel":"%s"}' "$CHANNEL")
          curl -fsS -X POST http://localhost:8090/v1/stream/stop \
            -H 'Content-Type: application/json' \
            -d "$stop_body" || true
          sleep 2
          if ! curl -fsS -X POST http://localhost:8090/v1/stream/start \
            -H 'Content-Type: application/json' \
            -d "$stop_body" \
            --max-time 60; then
            echo "::warning::HLS probe: /v1/stream/start failed for $CHANNEL (channel may be offline)"
            exit 0
          fi
          manifest_url="http://localhost:8090/live/${CHANNEL}/index.m3u8"
          for i in $(seq 1 50); do
            if curl -fsS "$manifest_url" >/dev/null 2>&1; then
              echo "HLS probe: manifest 200 at $manifest_url"
              exit 0
            fi
            sleep 0.5
          done
          echo "::warning::HLS probe: manifest not ready at $manifest_url (channel may be offline)"
          exit 0

      - name: Dump compose state on failure
        if: failure()
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml ps
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml logs

      - name: Stop stack
        if: always()
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.local-tunnel.yml \
            -f deploy/docker-compose.release.yml down -v

  package:
    name: Package release bundle
    needs: [publish, release-smoke]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      needs.release-smoke.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref_type == 'tag' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve bundle version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: bash scripts/package-release.sh

      - name: Validate release env synthesis
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: bash scripts/validate-release-env.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          files: |
            dist/streamclone-${{ steps.ver.outputs.value }}-windows.zip
            dist/streamclone-${{ steps.ver.outputs.value }}.tar.gz
            dist/Install Streamclone.cmd
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.value, '-rc') }}
