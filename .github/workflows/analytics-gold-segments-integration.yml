name: Analytics Gold segment integration

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-segment-store:
    name: gold_vod_segments store (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start integration Postgres
        run: make integration-up
      - name: Wait for Postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 15432 -U app 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres not ready on :15432" >&2
          exit 1
      - name: Run Gold segment tests
        env:
          INTEGRATION: "1"
          TEST_DATABASE_URL: postgres://app:test@127.0.0.1:15432/emotes?sslmode=disable
        run: go test ./internal/analytics/... -run 'GoldVODSegmentStore|GoldVODSegmentKey|PlanGoldVOD' -count=1 -timeout 120s
