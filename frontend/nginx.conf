map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /live/ {
        proxy_pass http://mediamtx:8888;
    }

    location /emotes/ {
        proxy_pass http://emote:8080;
    }

    location /v1/ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://chat:8080;
    }

    location ~ ^/v1/(auth|me|logout|followed) {
        proxy_pass http://chat:8080;
    }

    location /v1/stream/ {
        proxy_pass http://video:8080;
    }

    location ~ ^/v1/channels/[^/]+/emotes {
        proxy_pass http://emote:8080;
    }

    location ~ ^/v1/(emotes|sets|seed) {
        proxy_pass http://emote:8080;
    }

    location /v1/ {
        proxy_pass http://metadata:8080;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
