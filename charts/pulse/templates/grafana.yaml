{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}-grafana-provisioning
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      {{- if .Values.influxdb.enabled }}
      - name: InfluxDB
        type: influxdb
        access: proxy
        isDefault: true
        url: {{ include "pulse.influxURL" . }}
        jsonData:
          version: Flux
          organization: {{ .Values.influxdb.org | quote }}
          defaultBucket: {{ .Values.influxdb.bucket | quote }}
        secureJsonData:
          token: $__file{/etc/pulse-secrets/influxdb-token}
      {{- end }}
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Pulse
        orgId: 1
        folder: Emote Pulse
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}-grafana-dashboards
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
data:
  emote-pulse.json: |
{{ .Files.Get "dashboards/emote-pulse.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse.fullname" . }}-grafana
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "pulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulse.secretName" . }}
                  key: grafana-admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulse.secretName" . }}
                  key: grafana-admin-password
            - name: GF_USERS_DEFAULT_THEME
              value: dark
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: secrets
              mountPath: /etc/pulse-secrets
              readOnly: true
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "pulse.fullname" . }}-grafana-provisioning
        - name: dashboards
          configMap:
            name: {{ include "pulse.fullname" . }}-grafana-dashboards
        - name: secrets
          secret:
            secretName: {{ include "pulse.secretName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-grafana
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.grafana.serviceType }}
  selector:
    {{- include "pulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: {{ .Values.grafana.servicePort }}
      targetPort: http
{{- end }}
