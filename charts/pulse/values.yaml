namespace: streamclone

influxdb:
  enabled: true
  org: streamclone
  bucket: streamclone
  adminToken: dev-pulse-token
  image: influxdb:2.7-alpine
  username: admin
  password: devpulse
  # ClusterIP + port-forward (0.0.0.0) so Compose analytics can reach Influx via WSL IP.
  # LoadBalancer on :18086 binds 127.0.0.1 only on Docker Desktop and blocks Docker.
  serviceType: ClusterIP
  servicePort: 18086
  persistence:
    enabled: true
    size: 20Gi

grafana:
  enabled: true
  adminUser: admin
  adminPassword: devpulse
  # Emote image URLs are loaded by the browser (Grafana at localhost:3000), not the Grafana pod.
  emoteProxyURL: http://localhost:8090
  # Days of stream history for the stream picker Flux queries.
  streamListDays: 90
  # LoadBalancer: Docker Desktop maps to localhost:3000 (no kubectl port-forward).
  serviceType: LoadBalancer
  servicePort: 3000
  image: grafana/grafana:11.5.0

prometheus:
  enabled: true
  image: prom/prometheus:v2.55.0
  retention: 15d
  serviceType: LoadBalancer
  servicePort: 9090
  # Scrape Streamclone Compose services on the Docker Desktop host (analytics on :8086).
  streamcloneScrape:
    enabled: true
    host: host.docker.internal
    targets:
      - job: metadata
        port: 8081
      - job: video
        port: 8082
      - job: chat
        port: 8083
      - job: emote
        port: 8084
      - job: analytics
        port: 8086
