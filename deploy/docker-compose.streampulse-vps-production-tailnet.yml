# Tailnet-only Postgres/Redis for streampulse-vps production (BearHost remote worker).
# Merge after streampulse-vps-production.yml. Set STREAMPULSE_TAILNET_BIND_IP to `tailscale ip -4`.
name: streamclone-production

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
      - "${STREAMPULSE_TAILNET_BIND_IP:?tailscale ip required}:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
      - "${STREAMPULSE_TAILNET_BIND_IP:?tailscale ip required}:6379:6379"
