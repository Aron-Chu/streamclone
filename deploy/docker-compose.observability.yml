# Observability overlay — Prometheus + Grafana only (no Influx/pulse).
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.observability.yml --profile observability up -d

services:
  prometheus-obs:
    profiles: [observability]
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-obs-data:/prometheus
      - ./prometheus/prometheus-observability.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      alertmanager-obs:
        condition: service_started

  alertmanager-obs:
    profiles: [observability]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /etc/streamclone/secrets/alertmanager-webhook-url:/etc/alertmanager/secrets/webhook_url:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  node-exporter-obs:
    profiles: [observability]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:9100

  grafana-obs:
    profiles: [observability]
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-streampulse}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-obs-data:/var/lib/grafana
      - ./grafana/provisioning-obs:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus-obs:
        condition: service_started

volumes:
  grafana-obs-data:
  prometheus-obs-data:
