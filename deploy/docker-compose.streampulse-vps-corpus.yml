# Standalone Silver/Gold corpus workers on streampulse-vps (Tailscale → BearHost SoT).
#
# Worker-only stack: scraper (TwitchTracker) + analytics-workers (Bronze/Silver/Gold
# backfill). Connects to PROD Postgres/Redis over private Tailscale; does NOT serve
# the public API and does NOT run the in-process live IRC collector.
#
# Setup (one-time):
#   cp deploy/env/profile-streampulse-vps-corpus.env \
#      deploy/env/profile-streampulse-vps-corpus.local.env
#   # edit deploy/env/profile-streampulse-vps-corpus.local.env (DB/Redis/Twitch/scraper)
#
# Run on streampulse-vps (after `tailscale up` and prod DB/Redis reachable):
#   docker compose -f deploy/docker-compose.streampulse-vps-corpus.yml up -d --build
#
# Stop corpus workers instantly (live collector unaffected — separate compose project):
#   docker compose -f deploy/docker-compose.streampulse-vps-corpus.yml down
#
# Canary: start with SCRAPER_MAX_CONCURRENT=1 and ANALYTICS_VOD_GQL_CONCURRENCY=1
# in the local env; ramp only after soak (see docs/streampulse-vps.md).
name: streamclone-corpus

services:
  scraper:
    build:
      context: ../../streamclone-scraper
      dockerfile: Dockerfile
    container_name: streampulse-scraper
    restart: unless-stopped
    env_file:
      - path: env/profile-streampulse-vps-corpus.local.env
        required: false
    environment:
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-local-dev-key}
      SCRAPER_MAX_CONCURRENT: ${SCRAPER_MAX_CONCURRENT:-1}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  analytics-workers:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: analytics }
    container_name: streampulse-analytics-workers
    restart: unless-stopped
    env_file:
      - path: env/profile-streampulse-vps-corpus.local.env
        required: false
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      SCRAPER_API_URL: http://scraper:8000/v2/scrape
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-local-dev-key}
      METADATA_SERVICE_URL: http://bearhost:8080
      TIMESERIES_ENABLED: "false"
      # Master corpus gate — must be 1/true for workers to start (see cmd/analytics/main.go).
      CORPUS_WORKERS_ENABLED: "1"
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-false}
      BRONZE_ENABLED: ${BRONZE_ENABLED:-false}
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-true}
      GOLD_BACKFILL_ENABLED: ${GOLD_BACKFILL_ENABLED:-true}
      BACKFILL_GOLD_WORKER_ENABLED: ${BACKFILL_GOLD_WORKER_ENABLED:-true}
      BACKFILL_GOLD_WORKER_COUNT: ${BACKFILL_GOLD_WORKER_COUNT:-1}
      BACKFILL_SILVER_WORKER_COUNT: ${BACKFILL_SILVER_WORKER_COUNT:-1}
      BACKFILL_STALE_RUNNING_AFTER: ${BACKFILL_STALE_RUNNING_AFTER:-15m}
      BACKFILL_HEARTBEAT_INTERVAL: ${BACKFILL_HEARTBEAT_INTERVAL:-60s}
      BACKFILL_WORKER_INTERVAL: ${BACKFILL_WORKER_INTERVAL:-30s}
      BACKFILL_QUEUE_MAINTENANCE_ENABLED: ${BACKFILL_QUEUE_MAINTENANCE_ENABLED:-true}
      BACKFILL_REQUEUE_FAILED_MAX_PER_RUN: ${BACKFILL_REQUEUE_FAILED_MAX_PER_RUN:-25}
      GOLD_MIN_PEAK_VIEWERS: ${GOLD_MIN_PEAK_VIEWERS:-5000}
      GOLD_MIN_DURATION_MINUTES: ${GOLD_MIN_DURATION_MINUTES:-60}
      GOLD_ENQUEUER_INTERVAL: ${GOLD_ENQUEUER_INTERVAL:-15m}
      GOLD_SYNC_TIMEOUT_MS: ${GOLD_SYNC_TIMEOUT_MS:-600000}
      SILVER_AUTO_ENQUEUE_ENABLED: ${SILVER_AUTO_ENQUEUE_ENABLED:-true}
      SILVER_ENQUEUE_SINCE_DAYS: ${SILVER_ENQUEUE_SINCE_DAYS:-60}
      SILVER_ENQUEUE_TOP_N: ${SILVER_ENQUEUE_TOP_N:-200}
      SILVER_ENQUEUE_MAX_PER_RUN: ${SILVER_ENQUEUE_MAX_PER_RUN:-25}
      SILVER_ENQUEUE_INTERVAL: ${SILVER_ENQUEUE_INTERVAL:-15m}
      ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS: ${ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS:-120000}
      ANALYTICS_TT_SYNC_TIMEOUT_MS: ${ANALYTICS_TT_SYNC_TIMEOUT_MS:-120000}
      ANALYTICS_PASS_TT_MAXAGE: ${ANALYTICS_PASS_TT_MAXAGE:-true}
      ANALYTICS_TT_SCRAPE_BACKOFF_ENABLED: ${ANALYTICS_TT_SCRAPE_BACKOFF_ENABLED:-true}
      ANALYTICS_TT_BACKGROUND_RETRY_ENABLED: ${ANALYTICS_TT_BACKGROUND_RETRY_ENABLED:-true}
      # Live IRC collector stays off on this host (pulse-collector runs separately).
      PULSE_COLLECTOR_ENABLED: "false"
      PULSE_MAX_ACTIVE_CHANNELS: "0"
      MAX_CONCURRENT_TRACKED_CHANNELS: "0"
    depends_on:
      scraper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
