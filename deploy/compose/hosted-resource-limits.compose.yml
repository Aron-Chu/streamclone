# Reference resource limits — apply ONE service at a time during soak
#
# Do NOT merge this file wholesale into production. Use staged fragments under
# deploy/compose/limits/.
#
# Uses Compose-native mem_limit/cpus/pids_limit (not deploy.resources — ignored
# on plain docker compose without Swarm).

services:
  redis:
    mem_limit: 2560m
    restart: unless-stopped

  scraper:
    mem_limit: 1280m
    pids_limit: 256
    restart: unless-stopped

  postgres:
    mem_limit: 2560m
    shm_size: 256mb
    restart: unless-stopped

  minio:
    mem_limit: 3584m
    restart: unless-stopped

  caddy:
    restart: unless-stopped
