# BearHost overlay — isolated Pulse staging on 127.0.0.1:8091 (LOAD-001b).
# Merge:
#   --env-file deploy/env/profile-bearhost-prod.env
#   --env-file deploy/env/profile-bearhost-pulse-staging.env
#   -f deploy/docker-compose.bearhost-pulse-staging.yml
#
# Uses COMPOSE_PROJECT_NAME=streamclone-pulse-staging — separate containers/volumes from production pulse.

services:
  analytics:
    container_name: streamclone-pulse-staging-analytics
    environment:
      TIER0_ENABLED: "true"
      BACKFILL_ENABLED: "false"
      BRONZE_ENABLED: "false"
      ARCHIVE_ENABLED: "false"
      GOLD_BACKFILL_ENABLED: "false"
      PULSE_HOSTED_MODE: ${PULSE_HOSTED_MODE:-true}
      PULSE_BETA_KEYS: ${PULSE_BETA_KEYS:-}
      PULSE_MAX_ACTIVE_CHANNELS: ${PULSE_MAX_ACTIVE_CHANNELS:-25}
      PULSE_MAX_BACKFILLS: ${PULSE_MAX_BACKFILLS:-1}
      MAX_CONCURRENT_TRACKED_CHANNELS: ${PULSE_MAX_ACTIVE_CHANNELS:-25}
      STREAMCLONE_VERSION: ${STREAMCLONE_VERSION:-dev}
      EMOTE_SERVICE_URL: http://emote:8080

  analytics-workers:
    profiles: ["corpus"]

  scraper:
    profiles: ["corpus"]

  caddy:
    profiles: ["full-ui"]

  pulse-caddy:
    image: caddy:2
    restart: unless-stopped
    container_name: streamclone-pulse-staging-caddy
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile.pulse-api:/etc/caddy/Caddyfile:ro
      - pulse-staging-caddy-data:/data
      - pulse-staging-caddy-config:/config
    depends_on:
      analytics:
        condition: service_healthy
      emote:
        condition: service_healthy
      metadata:
        condition: service_healthy
      minio:
        condition: service_started

  emote:
    container_name: streamclone-pulse-staging-emote
    environment:
      CDN_PUBLIC_BASE: ${PUBLIC_ORIGIN:-http://127.0.0.1:8091}/emotes

  metadata:
    container_name: streamclone-pulse-staging-metadata

  postgres:
    container_name: streamclone-pulse-staging-postgres

  redis:
    container_name: streamclone-pulse-staging-redis

  minio:
    container_name: streamclone-pulse-staging-minio

  migrate:
    container_name: streamclone-pulse-staging-migrate

  video:
    profiles: ["playback"]

  chat:
    profiles: ["playback"]

  frontend:
    profiles: ["ui"]

  mediamtx:
    profiles: ["playback"]

volumes:
  pulse-staging-caddy-data:
  pulse-staging-caddy-config:
