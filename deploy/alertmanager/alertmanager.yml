# Alertmanager routing for BearHost observability stack.
# Webhook URL is loaded from a host secret file — never commit the URL.
global:
  resolve_timeout: 5m

route:
  receiver: operator-default
  group_by: [alertname, lane]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - lane = corpus
      receiver: operator-corpus
    - matchers:
        - lane = hosted
      receiver: operator-hosted

receivers:
  - name: operator-default
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
  - name: operator-hosted
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
  - name: operator-corpus
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
