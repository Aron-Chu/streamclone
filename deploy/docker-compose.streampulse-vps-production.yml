# StreamPulse VPS production overlay — API + Postgres + Redis + single corpus worker.
#
# Bigger VPS (streampulse-vps, 23.173.152.156) becomes production SoT. No Tailscale
# dependency on BearHost for Postgres/Redis.
#
# Merge (on VPS after BearHost pg_restore):
#   docker compose --project-name streamclone-production \
#     --env-file .env \
#     --env-file deploy/env/profile-full.env \
#     --env-file deploy/env/profile-streampulse-vps-production.local.env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.bearhost-build.yml \
#     -f deploy/docker-compose.bearhost-prod.yml \
#     -f deploy/docker-compose.bearhost-pulse.yml \
#     -f deploy/docker-compose.streampulse-vps-production.yml \
#     up -d
#
# Canary: keep BACKFILL_GOLD_WORKER_COUNT=1 and GOLD_VOD_SEGMENTS_ENABLED=true on
# analytics-workers only until soak passes. Do not enable a second worker here.
name: streamclone-production

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  analytics:
    environment:
      BACKFILL_ENABLED: "false"
      GOLD_BACKFILL_ENABLED: "false"
      CORPUS_WORKERS_ENABLED: "0"
      GOLD_VOD_SEGMENTS_ENABLED: "false"
      PULSE_MAX_ACTIVE_CHANNELS: ${PULSE_MAX_ACTIVE_CHANNELS:-10}
      MAX_CONCURRENT_TRACKED_CHANNELS: ${PULSE_MAX_ACTIVE_CHANNELS:-10}
      PULSE_TOP500_ADMISSION_ENABLED: ${PULSE_TOP500_ADMISSION_ENABLED:-false}
      PULSE_TOP500_ADMISSION_TOP_N: ${PULSE_TOP500_ADMISSION_TOP_N:-100}
      PULSE_TOP500_ADMISSION_INTERVAL: ${PULSE_TOP500_ADMISSION_INTERVAL:-60s}
      TOP500_METADATA_ENABLED: ${TOP500_METADATA_ENABLED:-false}
      TOP500_METADATA_DRY_RUN: ${TOP500_METADATA_DRY_RUN:-true}
      TOP500_METADATA_WRITE_ENABLED: ${TOP500_METADATA_WRITE_ENABLED:-false}
      TOP500_METADATA_TOP_N: ${TOP500_METADATA_TOP_N:-100}
      TOP500_METADATA_LIVE_INTERVAL: ${TOP500_METADATA_LIVE_INTERVAL:-60s}
      TOP500_METADATA_BATCH_SIZE: ${TOP500_METADATA_BATCH_SIZE:-100}
      CORPUS_TARGET_TOP_N: ${CORPUS_TARGET_TOP_N:-0}
      CDN_PUBLIC_BASE: ${CDN_PUBLIC_BASE:-https://api.streampulse.stream/emotes}
      ADMIN_ARCHIVE_ENABLED: ${ADMIN_ARCHIVE_ENABLED:-1}

  emote:
    environment:
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-false}

  analytics-workers:
    profiles: []
    container_name: streampulse-analytics-workers
    restart: unless-stopped
    environment:
      CORPUS_WORKERS_ENABLED: "1"
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-true}
      GOLD_BACKFILL_ENABLED: ${GOLD_BACKFILL_ENABLED:-true}
      BACKFILL_GOLD_WORKER_COUNT: ${BACKFILL_GOLD_WORKER_COUNT:-1}
      BACKFILL_SILVER_WORKER_COUNT: ${BACKFILL_SILVER_WORKER_COUNT:-1}
      ANALYTICS_VOD_GQL_CONCURRENCY: ${ANALYTICS_VOD_GQL_CONCURRENCY:-2}
      ANALYTICS_VOD_GQL_CONCURRENCY_MAX: ${ANALYTICS_VOD_GQL_CONCURRENCY_MAX:-4}
      GOLD_VOD_SEGMENTS_ENABLED: ${GOLD_VOD_SEGMENTS_ENABLED:-true}
      PULSE_MAX_ACTIVE_CHANNELS: "0"
      MAX_CONCURRENT_TRACKED_CHANNELS: "0"
      TIMESERIES_ENABLED: "false"
      ARCHIVE_PRIMARY_PROVIDER: ${ARCHIVE_PRIMARY_PROVIDER:-azure}
      ARCHIVE_DUAL_WRITE: ${ARCHIVE_DUAL_WRITE:-false}
      ARCHIVE_READ_THROUGH: ${ARCHIVE_READ_THROUGH:-false}
      ARCHIVE_AZURE_CONNECTION_STRING_FILE: ${ARCHIVE_AZURE_CONNECTION_STRING_FILE:-/etc/streamclone/secrets/azure-archive-connection-string}
      ARCHIVE_R2_BUCKET: ${ARCHIVE_R2_BUCKET:-}
      ARCHIVE_R2_ACCOUNT_ID: ${ARCHIVE_R2_ACCOUNT_ID:-}
      ARCHIVE_R2_PREFIX: ${ARCHIVE_R2_PREFIX:-archive}
      ARCHIVE_R2_ENDPOINT: ${ARCHIVE_R2_ENDPOINT:-}
      ARCHIVE_R2_ACCESS_KEY_ID_FILE: ${ARCHIVE_R2_ACCESS_KEY_ID_FILE:-/etc/streamclone/secrets/r2-access-key-id}
      ARCHIVE_R2_SECRET_ACCESS_KEY_FILE: ${ARCHIVE_R2_SECRET_ACCESS_KEY_FILE:-/etc/streamclone/secrets/r2-secret-access-key}
      GQL_WORKER_ID: ${GQL_WORKER_ID:-streampulse-vps-workers}
      SCRAPER_ID: ${SCRAPER_ID:-streampulse-vps-workers}
    volumes:
      - ${STREAMCLONE_SECRETS_DIR:-/etc/streamclone/secrets}:/etc/streamclone/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      scraper:
        condition: service_healthy

  scraper:
    profiles: []
    container_name: streampulse-scraper

  pulse-caddy:
    ports: !override
      - "127.0.0.1:8090:80"

  video:
    profiles: ["playback"]

  chat:
    profiles: ["playback"]

  frontend:
    profiles: ["ui"]

  mediamtx:
    profiles: ["playback"]

  caddy:
    profiles: ["full-ui"]
