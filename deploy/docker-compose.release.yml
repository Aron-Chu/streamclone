# Release overlay — pull pre-built images from GHCR instead of local builds.
# Clip Studio / clipper: ReplayForge sibling repo (not bundled in Streamclone images).
# Usage:
#   IMAGE_TAG=latest docker compose --env-file .env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.local-tunnel.yml \
#     -f deploy/docker-compose.release.yml up -d --pull always

services:
  migrate:
    image: ghcr.io/aron-chu/streamclone/migrate:${IMAGE_TAG:-latest}
    volumes: !reset []

  metadata:
    image: ghcr.io/aron-chu/streamclone/metadata:${IMAGE_TAG:-latest}
    build: !reset null

  video:
    image: ghcr.io/aron-chu/streamclone/video:${IMAGE_TAG:-latest}
    build: !reset null

  chat:
    image: ghcr.io/aron-chu/streamclone/chat:${IMAGE_TAG:-latest}
    build: !reset null

  emote:
    image: ghcr.io/aron-chu/streamclone/emote:${IMAGE_TAG:-latest}
    build: !reset null

  frontend:
    image: ghcr.io/aron-chu/streamclone/frontend:${IMAGE_TAG:-latest}
    build: !reset null
    # Pre-built image already includes nginx config — no host bind mounts in release bundles.
    volumes: !reset []
