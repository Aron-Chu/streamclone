logLevel: info

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsSegmentCount: 5
hlsSegmentDuration: 1s
hlsAllowOrigins: ["*"]
# Treat Caddy as a trusted CDN so browser HLS works over HTTP localhost without Secure cookies.
hlsCDNSecret: streamclone-local-hls-cdn

metrics: yes
metricsAddress: :9998

paths:
  "~^live/.*$":
    source: publisher
