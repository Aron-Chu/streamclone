name: streamclone

x-go: &go
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s
  environment: &go-env
    HTTP_ADDR: ":8080"
    LOG_LEVEL: info
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgres://app:app@postgres:5432/streamclone?sslmode=disable
    SCRAPER_API_URL: http://scraper:8000/v2/scrape
    SCRAPER_API_KEY: ${SCRAPER_API_KEY:-local-dev-key}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: streamclone
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d streamclone"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    ports: ["127.0.0.1:1935:1935", "127.0.0.1:8888:8888"]

  migrate:
    image: migrate/migrate
    volumes: ["../migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://app:app@postgres:5432/streamclone?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  metadata:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: metadata }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      REDDIT_PROVIDER: ${REDDIT_PROVIDER:-off}
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  video:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile.video
    env_file:
      - ../.env
    environment:
      <<: *go-env
      STREAM_WORKER_BACKENDS: ${STREAM_WORKER_BACKENDS:-direct_hls,streamlink}
      DEFAULT_STREAM_QUALITY: ${DEFAULT_STREAM_QUALITY:-best}
      MEDIAMTX_RTMP: mediamtx:1935
      HLS_INTERNAL_BASE: http://mediamtx:8888
      HLS_PUBLIC_BASE: http://localhost:8888
      STREAMLINK_HLS_LIVE_EDGE: ${STREAMLINK_HLS_LIVE_EDGE:-2}
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started

  chat:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: chat }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      CLIPPER_AUTH_SYNC_PATH: /runtime/clipper-twitch.env
    volumes:
      - ../runtime:/runtime
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      redis:
        condition: service_healthy

  analytics:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: analytics }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      EMOTE_SERVICE_URL: http://emote:8080
      ANALYTICS_VOD_GQL_CONCURRENCY: ${ANALYTICS_VOD_GQL_CONCURRENCY:-8}
      ANALYTICS_VOD_GQL_CONCURRENCY_MIN: ${ANALYTICS_VOD_GQL_CONCURRENCY_MIN:-3}
      ANALYTICS_VOD_GQL_CONCURRENCY_MAX: ${ANALYTICS_VOD_GQL_CONCURRENCY_MAX:-8}
      ANALYTICS_VOD_GQL_INCREMENTAL_DB: ${ANALYTICS_VOD_GQL_INCREMENTAL_DB:-true}
      ANALYTICS_VOD_GQL_SEGMENT_SECONDS: ${ANALYTICS_VOD_GQL_SEGMENT_SECONDS:-300}
      ANALYTICS_VOD_GQL_DENSE_SEGMENT_SECONDS: ${ANALYTICS_VOD_GQL_DENSE_SEGMENT_SECONDS:-120}
      ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS: ${ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS:-120000}
      ANALYTICS_PASS_TT_MAXAGE: ${ANALYTICS_PASS_TT_MAXAGE:-true}
      ANALYTICS_TT_MAX_AGE_MS: ${ANALYTICS_TT_MAX_AGE_MS:-0}
      ANALYTICS_TT_STALE_MAX_AGE_MS: ${ANALYTICS_TT_STALE_MAX_AGE_MS:-604800000}
      ANALYTICS_TT_PREFETCH_ENABLED: ${ANALYTICS_TT_PREFETCH_ENABLED:-true}
      TIMESERIES_ENABLED: ${TIMESERIES_ENABLED:-false}
      TIMESERIES_BACKEND: ${TIMESERIES_BACKEND:-influxdb}
      INFLUXDB_URL: ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-streamclone}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-streamclone}
      TIMESERIES_WRITE_TIMEOUT_MS: ${TIMESERIES_WRITE_TIMEOUT_MS:-1000}
      TIMESERIES_QUEUE_SIZE: ${TIMESERIES_QUEUE_SIZE:-1024}
      TIMESERIES_BACKFILL_ON_START: ${TIMESERIES_BACKFILL_ON_START:-false}
      # Direct HTTP fast path skips the browser scrape when TT serves plain HTTP;
      # auto-disables for 1h if success rate drops below 10% (internal/analytics/direct_http.go).
      ANALYTICS_TT_DIRECT_HTTP_ENABLED: ${ANALYTICS_TT_DIRECT_HTTP_ENABLED:-true}
      ANALYTICS_TT_DIRECT_HTTP_STALE_ONLY: ${ANALYTICS_TT_DIRECT_HTTP_STALE_ONLY:-false}
      ANALYTICS_TT_DIRECT_HTTP_TIMEOUT_MS: ${ANALYTICS_TT_DIRECT_HTTP_TIMEOUT_MS:-1200}
    ports: ["127.0.0.1:8086:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  emote:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile.emote
    env_file:
      - ../.env
    environment:
      <<: *go-env
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_METADATA_URL: auto
      VITE_VIDEO_URL: auto
      VITE_EMOTE_URL: auto
      VITE_ANALYTICS_URL: auto
      VITE_CHAT_HTTP: auto
      VITE_CHAT_WS: auto
      VITE_CLIPPER_URL: auto
      VITE_CLIPPER_TOKEN: ${VITE_CLIPPER_TOKEN:-${CLIPPER_WEBHOOK_TOKEN:-}}
      VITE_MAX_RETAINED_MESSAGES: ${MAX_RETAINED_MESSAGES:-250}
      STREAMCLONE_PROFILE: ${STREAMCLONE_PROFILE:-core}
      TWITCH_DEV_TOKEN_IMPORT_ENABLED: ${TWITCH_DEV_TOKEN_IMPORT_ENABLED:-false}
      SETUP_CONTROL_TOKEN: ${SETUP_CONTROL_TOKEN:-}
      STREAMCLONE_INSTALL_ID: ${STREAMCLONE_INSTALL_ID:-}
    volumes:
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      metadata:
        condition: service_healthy
      video:
        condition: service_healthy
      chat:
        condition: service_healthy
      analytics:
        condition: service_healthy
      emote:
        condition: service_healthy

  clipper:
    profiles: [clipper]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile.clipper
    env_file:
      - ../.env
    environment:
      CLIPPER_HOST: "0.0.0.0"
      CLIPPER_PORT: 8095
      CLIPPER_DATA_DIR: "/data"
      CLIPPER_DB_PATH: "/data/clipper.sqlite"
      CLIPPER_OUTPUT_DIR: "/data/output"
    ports: ["127.0.0.1:8095:8095"]
    volumes:
      - clipper-data:/data

  # Scraper browser profiles (override via ../.env):
  #   Bridge (local Windows dev): SCRAPER_EPHEMERAL_BROWSER=true, SCRAPER_MAX_CONCURRENT=1
  #   Pooled (production): SCRAPER_EPHEMERAL_BROWSER=false, SCRAPER_BROWSER_POOL_SIZE=1, SCRAPER_MAX_CONCURRENT=2
  # Never raise MAX_CONCURRENT above 1 while ephemeral=true — competing Camoufox profiles deadlock TT detail scrapes.
  # Release image (SCRAPER_USE_IMAGES=1): ghcr.io/aron-chu/streamclone/scraper:${IMAGE_TAG:-latest} via docker-compose.release.yml
  scraper:
    profiles: [scraper]
    build:
      context: ../../streamclone-scraper
      dockerfile: Dockerfile
    container_name: streamclone-scraper
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "2gb"
    env_file:
      - ../.env
    environment:
      - SCRAPER_BROWSER=${SCRAPER_BROWSER:-camoufox}
      - CDP_URL=${CDP_URL:-}
      - SCRAPER_CDP_EPHEMERAL=${SCRAPER_CDP_EPHEMERAL:-false}
      - CDP_DEBUG_PORT=${CDP_DEBUG_PORT:-9222}
      - CDP_CHROME_PATH=${CDP_CHROME_PATH:-}
      - CAMOUFOX_GEOIP=${CAMOUFOX_GEOIP:-false}
      - CAMOUFOX_PERSISTENT_PROFILE=/data/camoufox-profile
      - SCRAPER_EPHEMERAL_BROWSER=${SCRAPER_EPHEMERAL_BROWSER:-false}
      - SCRAPER_HEADLESS=${SCRAPER_HEADLESS:-true}
      - SCRAPER_MAX_CONCURRENT=${SCRAPER_MAX_CONCURRENT:-2}
      - SCRAPER_BROWSER_POOL_SIZE=${SCRAPER_BROWSER_POOL_SIZE:-1}
      - SCRAPER_CONTEXT_TTL_REQUESTS=${SCRAPER_CONTEXT_TTL_REQUESTS:-50}
      - SCRAPER_BROWSER_TTL_SECONDS=${SCRAPER_BROWSER_TTL_SECONDS:-3600}
      - SCRAPER_TT_DETAIL_CACHE_MS=${SCRAPER_TT_DETAIL_CACHE_MS:-604800000}
      - SCRAPER_TWITCHTRACKER_INJECT_HIGHCHARTS=${SCRAPER_TWITCHTRACKER_INJECT_HIGHCHARTS:-true}
      - BROWSER_PROFILE_DIR=/data/camoufox-profile
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - PROXY_BYPASS=${PROXY_BYPASS:-}
      - PROXY_POOL=${PROXY_POOL:-}
      - SESSION_VAULT_KEY=${SESSION_VAULT_KEY:-}
      - SESSION_VAULT_DIR=${SESSION_VAULT_DIR:-/data/sessions}
    volumes:
      - scraper-profile:/data
      - camoufox-cache:/root/.cache/camoufox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  influxdb:
    profiles: [pulse]
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-streampulse}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-streamclone}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-streamclone}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-local-pulse-token}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  grafana:
    profiles: [pulse]
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-streampulse}
      GF_USERS_DEFAULT_THEME: dark
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-local-pulse-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-streamclone}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-streamclone}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pg-data:
  minio-data:
  clipper-data:
  scraper-profile:
  camoufox-cache:
  influx-data:
  grafana-data:
