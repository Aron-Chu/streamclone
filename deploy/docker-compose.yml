name: streamclone

x-go: &go
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s
  environment: &go-env
    HTTP_ADDR: ":8080"
    LOG_LEVEL: info
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgres://app:app@postgres:5432/streamclone?sslmode=disable

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: streamclone
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d streamclone"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    environment:
      MTX_HLSVARIANT: ${MTX_HLSVARIANT:-mpegts}
      MTX_HLSSEGMENTCOUNT: ${MTX_HLSSEGMENTCOUNT:-10}
      MTX_HLSSEGMENTDURATION: ${MTX_HLSSEGMENTDURATION:-2s}
      MTX_HLSPARTDURATION: ${MTX_HLSPARTDURATION:-200ms}
    ports: ["127.0.0.1:1935:1935", "127.0.0.1:8888:8888"]

  migrate:
    image: migrate/migrate
    volumes: ["../migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://app:app@postgres:5432/streamclone?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  metadata:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: metadata }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      REDDIT_PROVIDER: ${REDDIT_PROVIDER:-off}
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8080/v1/streams?limit=1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  video:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile.video
    env_file:
      - ../.env
    environment:
      <<: *go-env
      STREAM_WORKER_BACKENDS: ${STREAM_WORKER_BACKENDS:-direct_hls,streamlink}
      DEFAULT_STREAM_QUALITY: ${DEFAULT_STREAM_QUALITY:-best}
      MEDIAMTX_RTMP: mediamtx:1935
      HLS_INTERNAL_BASE: http://mediamtx:8888
      HLS_PUBLIC_BASE: ${HLS_PUBLIC_BASE:-http://localhost:8090}
      HLS_LOW_LATENCY_ENABLED: ${HLS_LOW_LATENCY_ENABLED:-false}
      STREAMLINK_HLS_LIVE_EDGE: ${STREAMLINK_HLS_LIVE_EDGE:-2}
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started

  chat:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: chat }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      CLIPPER_AUTH_SYNC_PATH: /runtime/clipper-twitch.env
    volumes:
      - ../runtime:/runtime
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      redis:
        condition: service_healthy

  analytics:
    <<: *go
    profiles: [analytics]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: analytics }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      EMOTE_SERVICE_URL: http://emote:8080
      ANALYTICS_VOD_GQL_CONCURRENCY: ${ANALYTICS_VOD_GQL_CONCURRENCY:-8}
      ANALYTICS_VOD_GQL_CONCURRENCY_MIN: ${ANALYTICS_VOD_GQL_CONCURRENCY_MIN:-3}
      ANALYTICS_VOD_GQL_CONCURRENCY_MAX: ${ANALYTICS_VOD_GQL_CONCURRENCY_MAX:-8}
      ANALYTICS_VOD_GQL_INCREMENTAL_DB: ${ANALYTICS_VOD_GQL_INCREMENTAL_DB:-true}
      ANALYTICS_VOD_GQL_DEFER: ${ANALYTICS_VOD_GQL_DEFER:-true}
      ANALYTICS_VOD_GQL_ROLLUP_FLUSH_SEGMENTS: ${ANALYTICS_VOD_GQL_ROLLUP_FLUSH_SEGMENTS:-8}
      ANALYTICS_VOD_GQL_ROLLUP_FLUSH_MS: ${ANALYTICS_VOD_GQL_ROLLUP_FLUSH_MS:-2000}
      ANALYTICS_VOD_CHAT_REPLAY_ENABLED: ${ANALYTICS_VOD_CHAT_REPLAY_ENABLED:-1}
      ANALYTICS_VOD_CHAT_SENDER_SALT: ${ANALYTICS_VOD_CHAT_SENDER_SALT:-local-dev}
      ANALYTICS_VOD_CHAT_PRESERVE_URLS: ${ANALYTICS_VOD_CHAT_PRESERVE_URLS:-0}
      ANALYTICS_VOD_GQL_SEGMENT_SECONDS: ${ANALYTICS_VOD_GQL_SEGMENT_SECONDS:-300}
      ANALYTICS_VOD_GQL_DENSE_SEGMENT_SECONDS: ${ANALYTICS_VOD_GQL_DENSE_SEGMENT_SECONDS:-120}
      ANALYTICS_VOD_GQL_QUIET_SEGMENT_SECONDS: ${ANALYTICS_VOD_GQL_QUIET_SEGMENT_SECONDS:-900}
      ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS: ${ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS:-120000}
      ANALYTICS_PASS_TT_MAXAGE: ${ANALYTICS_PASS_TT_MAXAGE:-true}
      ANALYTICS_TT_SCRAPE_BACKOFF_ENABLED: ${ANALYTICS_TT_SCRAPE_BACKOFF_ENABLED:-true}
      ANALYTICS_TT_SYNC_TIMEOUT_MS: ${ANALYTICS_TT_SYNC_TIMEOUT_MS:-45000}
      ANALYTICS_TT_BACKGROUND_RETRY_ENABLED: ${ANALYTICS_TT_BACKGROUND_RETRY_ENABLED:-true}
      ANALYTICS_TT_MAX_AGE_MS: ${ANALYTICS_TT_MAX_AGE_MS:-0}
      ANALYTICS_TT_STALE_MAX_AGE_MS: ${ANALYTICS_TT_STALE_MAX_AGE_MS:-604800000}
      ANALYTICS_TT_PREFETCH_ENABLED: ${ANALYTICS_TT_PREFETCH_ENABLED:-true}
      ANALYTICS_TT_USE_PROXY: ${ANALYTICS_TT_USE_PROXY:-false}
      TIMESERIES_ENABLED: ${TIMESERIES_ENABLED:-false}
      TIMESERIES_BACKEND: ${TIMESERIES_BACKEND:-influxdb}
      INFLUXDB_URL: ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-streamclone}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-streamclone}
      TIMESERIES_WRITE_TIMEOUT_MS: ${TIMESERIES_WRITE_TIMEOUT_MS:-1000}
      TIMESERIES_QUEUE_SIZE: ${TIMESERIES_QUEUE_SIZE:-1024}
      TIMESERIES_BACKFILL_ON_START: ${TIMESERIES_BACKFILL_ON_START:-false}
      # Direct HTTP fast path skips the browser scrape when TT serves plain HTTP;
      # auto-disables for 1h if success rate drops below 10% (internal/analytics/direct_http.go).
      ANALYTICS_TT_DIRECT_HTTP_ENABLED: ${ANALYTICS_TT_DIRECT_HTTP_ENABLED:-true}
      ANALYTICS_TT_DIRECT_HTTP_STALE_ONLY: ${ANALYTICS_TT_DIRECT_HTTP_STALE_ONLY:-false}
      ANALYTICS_TT_DIRECT_HTTP_TIMEOUT_MS: ${ANALYTICS_TT_DIRECT_HTTP_TIMEOUT_MS:-1200}
      EMOTE_HISTORY_SNAPSHOT_ENABLED: ${EMOTE_HISTORY_SNAPSHOT_ENABLED:-false}
      EMOTE_HISTORY_SNAPSHOT_INTERVAL: ${EMOTE_HISTORY_SNAPSHOT_INTERVAL:-6h}
      EMOTE_HISTORY_SNAPSHOT_BATCH_SIZE: ${EMOTE_HISTORY_SNAPSHOT_BATCH_SIZE:-25}
      EMOTE_HISTORY_NORMALIZE_ENABLED: ${EMOTE_HISTORY_NORMALIZE_ENABLED:-false}
      EMOTE_HISTORY_NORMALIZE_INTERVAL: ${EMOTE_HISTORY_NORMALIZE_INTERVAL:-15m}
      EMOTE_HISTORY_NORMALIZE_SINCE: ${EMOTE_HISTORY_NORMALIZE_SINCE:-720h}
      EMOTE_HISTORY_NORMALIZE_BATCH_SIZE: ${EMOTE_HISTORY_NORMALIZE_BATCH_SIZE:-25}
    ports: ["127.0.0.1:8086:8080"]
    volumes:
      - ../runtime:/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  emote:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile.emote
    env_file:
      - ../.env
    environment:
      <<: *go-env
      SEVENTV_EVENTAPI_ENABLED: ${SEVENTV_EVENTAPI_ENABLED:-false}
      SEVENTV_EVENTAPI_URL: ${SEVENTV_EVENTAPI_URL:-wss://events.7tv.io/v3}
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      VITE_METADATA_URL: auto
      VITE_VIDEO_URL: auto
      VITE_EMOTE_URL: auto
      VITE_CHAT_HTTP: auto
      VITE_CHAT_WS: auto
      VITE_CLIPPER_URL: auto
      VITE_HLS_LOW_LATENCY_ENABLED: ${HLS_LOW_LATENCY_ENABLED:-false}
      VITE_ADAPTIVE_LIVE_LATENCY_ENABLED: ${ADAPTIVE_LIVE_LATENCY_ENABLED:-false}
      VITE_MAX_RETAINED_MESSAGES: ${MAX_RETAINED_MESSAGES:-250}
      STREAMCLONE_PROFILE: ${STREAMCLONE_PROFILE:-core}
      TWITCH_DEV_TOKEN_IMPORT_ENABLED: ${TWITCH_DEV_TOKEN_IMPORT_ENABLED:-false}
      SETUP_CONTROL_TOKEN: ${SETUP_CONTROL_TOKEN:-}
      SETUP_CONTROL_WAKE_ENABLED: ${SETUP_CONTROL_WAKE_ENABLED:-false}
      STREAMCLONE_INSTALL_ID: ${STREAMCLONE_INSTALL_ID:-}
    volumes:
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      metadata:
        condition: service_healthy
      video:
        condition: service_healthy
      chat:
        condition: service_healthy
      emote:
        condition: service_healthy

volumes:
  pg-data:
  minio-data:
