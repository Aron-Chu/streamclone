groups:
  - name: streamclone_archive
    rules:
      - alert: ArchiveJobsFailedSpike
        expr: increase(streamclone_archive_jobs_failed_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Archive job failures elevated
          description: More than 5 archive job failures in 15 minutes.

      - alert: ArchiveCoverageLow
        expr: streamclone_archive_coverage_ratio{tier="silver"} < 0.5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: Silver archive coverage below 50%

      - alert: ScraperErrorRateHigh
        expr: |
          sum(rate(analytics_scraper_requests_total{result="error"}[15m]))
          / clamp_min(sum(rate(analytics_scraper_requests_total[15m])), 0.001) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TwitchTracker scraper error rate above 25%
          description: Check streamclone-scraper logs and Cloudflare/proxy on BearHost.
