groups:
  - name: streamclone_archive
    rules:
      - alert: ArchiveJobsFailedSpike
        expr: increase(streamclone_archive_jobs_failed_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Archive job failures elevated
          description: More than 5 archive job failures in 15 minutes.

      - alert: ArchiveCoverageLow
        expr: streamclone_archive_coverage_ratio{tier="silver"} < 0.5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: Silver archive coverage below 50%

      - alert: ScraperErrorRateHigh
        expr: |
          sum(rate(analytics_scraper_requests_total{result="error"}[15m]))
          / clamp_min(sum(rate(analytics_scraper_requests_total[15m])), 0.001) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TwitchTracker scraper error rate above 25%
          description: Check streamclone-scraper logs and Grafana TT failure-by-reason panel (analytics_tt_scrape_failures_total).

      - alert: TTScrapeCloudflareSpike
        expr: |
          sum(rate(analytics_tt_scrape_failures_total{reason="cloudflare_challenge"}[15m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TwitchTracker Cloudflare failures elevated
          description: Classified cloudflare_challenge failures exceed 3/min over 15m; review scraper profile and cache-first behavior before enabling proxy.

      - alert: GoldBackfillQueueStale
        expr: |
          (sum(backfill_jobs_gauge{tier="gold",status="queued"}) > 0)
          and (max(backfill_oldest_queued_age_seconds{tier="gold"}) > 3600)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Gold backfill queue aging without progress
          description: Gold jobs have been queued over 1h; verify gold worker is running and silver exports are confirmed.

      - alert: BackfillStaleRunningJobs
        expr: sum(backfill_stale_running_gauge) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Stale backfill jobs stuck in running
          description: Running backfill jobs exceed BACKFILL_STALE_RUNNING_AFTER; reclaimer should reset them.

      - alert: BackfillGoldQueueStale
        expr: |
          max(backfill_oldest_queued_age_seconds{tier="gold"}) > 3600
          and sum(backfill_jobs_gauge{tier="gold",status="queued"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Gold backfill queue oldest job older than 1 hour
          description: Gold worker may be starved or stuck; check analytics-workers logs and stale running jobs.
