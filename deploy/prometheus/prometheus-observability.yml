global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/archive.yml
  - /etc/prometheus/alerts/top500-hosted.yml

scrape_configs:
  - job_name: analytics
    static_configs:
      - targets: ["analytics:8080"]

  - job_name: analytics-workers
    static_configs:
      - targets: ["analytics-workers:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter-obs:9100"]
