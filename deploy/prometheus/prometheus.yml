global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: analytics
    static_configs:
      - targets: ["analytics:8080"]

  - job_name: chat
    static_configs:
      - targets: ["chat:8080"]

  - job_name: video
    static_configs:
      - targets: ["video:8080"]

  - job_name: emote
    static_configs:
      - targets: ["emote:8080"]

  - job_name: metadata
    static_configs:
      - targets: ["metadata:8080"]
