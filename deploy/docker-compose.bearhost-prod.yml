# BearHost VPS production overlay — IP-only HTTP, analytics-workers, secrets mount.
# Merge (no local-tunnel):
#   docker compose --env-file .env \
#     --env-file deploy/env/profile-full.env \
#     --env-file deploy/env/profile-archive.env \
#     --env-file deploy/env/profile-bearhost-prod.env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.release.yml \
#     -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.bearhost-prod.yml \
#     --profile scraper
#
# Build-local (no GHCR): swap release.yml for deploy/docker-compose.bearhost-build.yml

services:
  analytics:
    environment:
      ARCHIVE_ENABLED: "false"
      TIER0_ENABLED: "false"
      BRONZE_ENABLED: "false"
      BACKFILL_ENABLED: "false"
      GOLD_BACKFILL_ENABLED: "false"
      ARCHIVE_PG_DUMP_NIGHTLY: "false"

  analytics-workers:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: analytics }
    container_name: streamclone-analytics-workers
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://app:app@postgres:5432/streamclone?sslmode=disable
      SCRAPER_API_URL: http://scraper:8000/v2/scrape
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-local-dev-key}
      METADATA_SERVICE_URL: http://metadata:8080
      EMOTE_SERVICE_URL: ${EMOTE_SERVICE_URL:-}
      TIMESERIES_ENABLED: ${TIMESERIES_ENABLED:-false}
      ANALYTICS_VOD_GQL_CONCURRENCY: ${ANALYTICS_VOD_GQL_CONCURRENCY:-1}
      ANALYTICS_VOD_GQL_CONCURRENCY_MIN: ${ANALYTICS_VOD_GQL_CONCURRENCY_MIN:-1}
      ANALYTICS_VOD_GQL_CONCURRENCY_MAX: ${ANALYTICS_VOD_GQL_CONCURRENCY_MAX:-1}
      ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS: ${ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS:-120000}
      ANALYTICS_TT_SYNC_TIMEOUT_MS: ${ANALYTICS_TT_SYNC_TIMEOUT_MS:-120000}
      ARCHIVE_AZURE_CONNECTION_STRING_FILE: ${ARCHIVE_AZURE_CONNECTION_STRING_FILE:-/run/streamclone-secrets/azure-archive-connection-string}
    volumes:
      - ${STREAMCLONE_SECRETS_DIR:-/etc/streamclone/secrets}:/run/streamclone-secrets:ro
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      metadata:
        condition: service_healthy
      scraper:
        condition: service_healthy

  scraper:
    image: !reset null
    build:
      context: ../../streamclone-scraper
      dockerfile: Dockerfile
    ports: !reset []

  caddy:
    volumes:
      - ./Caddyfile.bearhost:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  video:
    environment:
      HLS_PUBLIC_BASE: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}

  chat:
    environment:
      FRONTEND_ORIGIN: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      AUTH_COOKIE_SAMESITE: lax

  emote:
    environment:
      CDN_PUBLIC_BASE: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}/emotes

  frontend:
    environment:
      VITE_METADATA_URL: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      VITE_VIDEO_URL: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      VITE_EMOTE_URL: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      VITE_ANALYTICS_URL: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      VITE_CHAT_HTTP: http://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      VITE_CHAT_WS: ws://${APP_DOMAIN:?Set APP_DOMAIN in .env}/v1/ws
      VITE_MAX_RETAINED_MESSAGES: ${MAX_RETAINED_MESSAGES:-250}
