# Mode B — True Azure archive plane: Postgres, Redis, metadata, scraper, analytics-workers.
# DATABASE_URL targets the Azure-local postgres service (not local-streamclone over Tailscale).
# Merge profile-archive.env + profile-azure-workers.env on the VM.

name: streamclone-azure-archive-plane

x-go: &go
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s
  environment: &go-env
    HTTP_ADDR: ":8080"
    LOG_LEVEL: info
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgres://app:app@postgres:5432/streamclone?sslmode=disable
    SCRAPER_API_URL: http://scraper:8000/v2/scrape
    SCRAPER_API_KEY: ${SCRAPER_API_KEY:-local-dev-key}
    METADATA_SERVICE_URL: http://metadata:8080

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: streamclone
    volumes:
      - azure-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d streamclone"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes: ["../migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://app:app@postgres:5432/streamclone?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  metadata:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: metadata }
    env_file:
      - ../.env
    environment:
      <<: *go-env
      REDDIT_PROVIDER: ${REDDIT_PROVIDER:-off}
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8080/v1/streams?limit=1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scraper:
    build:
      context: ../../streamclone-scraper
      dockerfile: Dockerfile
    container_name: streamclone-scraper
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "2gb"
    env_file:
      - ../.env
    environment:
      SCRAPER_BROWSER: ${SCRAPER_BROWSER:-camoufox}
      CHALLENGE_FALLBACK_ENABLED: ${CHALLENGE_FALLBACK_ENABLED:-false}
      SCRAPER_EPHEMERAL_BROWSER: ${SCRAPER_EPHEMERAL_BROWSER:-false}
      SCRAPER_HEADLESS: ${SCRAPER_HEADLESS:-true}
      SCRAPER_MAX_CONCURRENT: ${SCRAPER_MAX_CONCURRENT:-1}
      SCRAPER_BROWSER_POOL_SIZE: ${SCRAPER_BROWSER_POOL_SIZE:-1}
      SCRAPER_CONTEXT_TTL_REQUESTS: ${SCRAPER_CONTEXT_TTL_REQUESTS:-50}
      SCRAPER_BROWSER_TTL_SECONDS: ${SCRAPER_BROWSER_TTL_SECONDS:-3600}
      SCRAPER_TT_DETAIL_CACHE_MS: ${SCRAPER_TT_DETAIL_CACHE_MS:-604800000}
      SCRAPER_TWITCHTRACKER_INJECT_HIGHCHARTS: ${SCRAPER_TWITCHTRACKER_INJECT_HIGHCHARTS:-true}
      CAMOUFOX_PERSISTENT_PROFILE: /data/camoufox-profile
      BROWSER_PROFILE_DIR: /data/camoufox-profile
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_BYPASS: ${PROXY_BYPASS:-}
      PROXY_POOL: ${PROXY_POOL:-}
      SESSION_VAULT_KEY: ${SESSION_VAULT_KEY:-}
      SESSION_VAULT_DIR: ${SESSION_VAULT_DIR:-/data/sessions}
    volumes:
      - scraper-profile:/data
      - camoufox-cache:/root/.cache/camoufox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  analytics-workers:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: analytics }
    container_name: streamclone-analytics-workers
    env_file:
      - ../.env
    environment:
      <<: *go-env
      EMOTE_SERVICE_URL: ${EMOTE_SERVICE_URL:-}
      TIMESERIES_ENABLED: ${TIMESERIES_ENABLED:-false}
      ANALYTICS_VOD_GQL_CONCURRENCY: ${ANALYTICS_VOD_GQL_CONCURRENCY:-1}
      ANALYTICS_VOD_GQL_CONCURRENCY_MIN: ${ANALYTICS_VOD_GQL_CONCURRENCY_MIN:-1}
      ANALYTICS_VOD_GQL_CONCURRENCY_MAX: ${ANALYTICS_VOD_GQL_CONCURRENCY_MAX:-1}
      ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS: ${ANALYTICS_TRACKER_SCRAPE_TIMEOUT_MS:-120000}
      ANALYTICS_TT_SYNC_TIMEOUT_MS: ${ANALYTICS_TT_SYNC_TIMEOUT_MS:-120000}
      ARCHIVE_AZURE_CONNECTION_STRING_FILE: ${ARCHIVE_AZURE_CONNECTION_STRING_FILE:-/run/streamclone-secrets/azure-archive-connection-string}
    volumes:
      - ${STREAMCLONE_SECRETS_DIR:-./runtime}:/run/streamclone-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      metadata:
        condition: service_healthy
      scraper:
        condition: service_healthy

volumes:
  azure-pg-data:
  scraper-profile:
  camoufox-cache:
