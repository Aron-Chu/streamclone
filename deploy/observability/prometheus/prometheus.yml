global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: streamclone-metadata
    static_configs:
      - targets: ["metadata:8080"]

  - job_name: streamclone-video
    static_configs:
      - targets: ["video:8080"]

  - job_name: streamclone-chat
    static_configs:
      - targets: ["chat:8080"]

  - job_name: streamclone-emote
    static_configs:
      - targets: ["emote:8080"]

  - job_name: streamclone-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://metadata:8080/readyz
          - http://video:8080/readyz
          - http://chat:8080/readyz
          - http://emote:8080/readyz
          - http://frontend/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: mediamtx
    static_configs:
      - targets: ["mediamtx:9998"]
